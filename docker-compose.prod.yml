# ============================================
# Producción — Zona Aquática
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Requiere un archivo .env con valores REALES (ver .env.prod.ejemplo)
# ============================================

x-backend-env: &backend-env
  FLASK_ENV: production
  TZ: America/La_Paz
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
  CORS_ORIGINS: https://${DOMAIN}
  CORREO_REMITENTE: ${CORREO_REMITENTE:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USUARIO: ${SMTP_USUARIO:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  AVISOS_HORA: ${AVISOS_HORA:-9}

services:
  db:
    image: postgres:16-alpine
    container_name: piscina_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: piscina_backend_prod
    restart: unless-stopped
    environment: *backend-env
    command: gunicorn -w 3 -b 0.0.0.0:5000 --timeout 120 run:app
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Envía los avisos de vencimiento por correo. Va aparte de gunicorn para que
  # sus workers no manden cada correo repetido.
  notificador:
    build: ./backend
    container_name: piscina_notificador_prod
    restart: unless-stopped
    environment: *backend-env
    command: python notificador.py
    depends_on:
      - backend

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: piscina_web_prod
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
    name: piscina_prod_db
  uploads_data:
    name: piscina_prod_uploads
  caddy_data:
  caddy_config:
